name: Site health check

on:
  # Scheduled cron disabled until either:
  #   (a) a WAF bypass is configured (secret header allowlisted before geo-challenge), or
  #   (b) probes are migrated to an external uptime service.
  # Re-enable by uncommenting the schedule block below.
  #
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://hello-world.alburg.se/healthz
          - https://recipes.alburg.se/
          - https://resources.alburg.se/
    steps:
      - name: Probe ${{ matrix.url }}
        run: |
          set +e
          for i in 1 2 3; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "${{ matrix.url }}")
            if [[ "$CODE" == "200" ]]; then
              echo "OK on attempt $i"
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE"
            sleep 10
          done
          echo "::warning::Probe failed three times — got HTTP $CODE"
          exit 1
